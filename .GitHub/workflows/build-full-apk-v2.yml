name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "App ID"
        required: true
        type: string

      user_id:
        description: "User ID"
        required: true
        type: string

      app_name:
        description: "App Name"
        required: true
        type: string

      package_name:
        description: "Package Name"
        required: true
        type: string

      storage_token_name:
        description: "Storage Token Name"
        required: true
        type: string


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            platform-tools


      # ==========================================
      # ACCEPT ALL ANDROID SDK LICENSES
      # ==========================================

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "ACCEPTING ANDROID SDK LICENSES"
          echo "=========================================="

          yes | sdkmanager --licenses >/tmp/sdk-licenses.log 2>&1

          LICENSE_STATUS=$?

          cat /tmp/sdk-licenses.log

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "License command returned status $LICENSE_STATUS."
            echo "Continuing because required SDK packages will be verified."
          fi

          echo ""
          echo "Android SDK license processing completed."


      # ==========================================
      # INSTALL REQUIRED ANDROID SDK PACKAGES
      # ==========================================

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING REQUIRED SDK PACKAGES"
          echo "=========================================="

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

          echo ""
          echo "Required Android SDK packages installed."


      # ==========================================
      # VERIFY ANDROID SDK
      # ==========================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "SDK Manager:"
          sdkmanager --version

          echo ""
          echo "Installed Android packages:"
          sdkmanager --list_installed

          echo ""
          echo "Checking required packages..."

          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/platform-tools"

          echo ""
          echo "Android SDK verification successful."


      # ==========================================
      # GRADLE 8.5
      # ==========================================

      - name: Install Gradle 8.5
        shell: bash
        run: |
          set -e

          wget -q \
            https://services.gradle.org/distributions/gradle-8.5-bin.zip

          unzip -q \
            gradle-8.5-bin.zip

          echo "$PWD/gradle-8.5/bin" >> "$GITHUB_PATH"

          export PATH="$PWD/gradle-8.5/bin:$PATH"

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          gradle --version


      # ==========================================
      # CHECK USER PROJECT
      # ==========================================

      - name: Check User Project
        shell: bash
        run: |
          set -e

          USER_ID="${{ inputs.user_id }}"
          PROJECT_DIR="native-apps/users/$USER_ID"

          echo "=========================================="
          echo "CHECKING USER PROJECT"
          echo "=========================================="

          echo "User ID: $USER_ID"
          echo "Project: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::User project folder not found"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app module not found"
            exit 1
          fi

          echo "sdk.dir=$ANDROID_HOME" \
            > "$PROJECT_DIR/local.properties"

          echo ""
          echo "local.properties created."

          cat "$PROJECT_DIR/local.properties"


      # ==========================================
      # VERIFY BUILD ENVIRONMENT
      # ==========================================

      - name: Verify Build Environment
        working-directory: native-apps/users/${{ inputs.user_id }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "=========================================="
          echo "FIXED WORKFLOW ENVIRONMENT"
          echo "=========================================="

          echo "Java: 17"
          echo "Gradle: 8.5"
          echo "Compile SDK: 34"
          echo "Build Tools: 34.0.0"
          echo "Target SDK: 34"
          echo "Min SDK: 21"

          echo ""
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          find . \
            -maxdepth 3 \
            -type f \
            ! -path "./.gradle/*" \
            | sort


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build User APK
        working-directory: native-apps/users/${{ inputs.user_id }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          echo ""
          echo "Starting Gradle build..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build completed successfully."


      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        working-directory: native-apps/users/${{ inputs.user_id }}
        shell: bash
        run: |
          set -e

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"

          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="

          echo "Checking:"
          echo "$APK_SOURCE"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated."

          ls -lh "$APK_SOURCE"


      # ==========================================
      # RENAME APK
      # ==========================================

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          set -e

          RAW_NAME="${{ inputs.app_name }}"

          SAFE_NAME=$(echo "$RAW_NAME" \
            | tr ' ' '_' \
            | tr -cd '[:alnum:]_.-')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="app"
          fi

          TARGET_DIR="native-apps/users/${{ inputs.user_id }}/app/build/outputs/apk/debug"

          APK_SOURCE="$TARGET_DIR/app-debug.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::APK not found at expected path: $APK_SOURCE"
            exit 1
          fi

          APK_NAME="${SAFE_NAME}.apk"

          APK_TARGET="$TARGET_DIR/$APK_NAME"

          cp "$APK_SOURCE" "$APK_TARGET"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_TARGET" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "APK RENAMED"
          echo "=========================================="

          echo "Original Name: $RAW_NAME"
          echo "Saved As: $APK_NAME"

          ls -lh "$APK_TARGET"


      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.user_id }}-${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error


      # ==========================================
      # DELETE OLD APK RELEASE
      # ==========================================

      - name: Delete Old APK Release
        env:
          GH_TOKEN: ${{ secrets.APK_STORAGE_TOKEN }}
        shell: bash
        run: |
          set -e

          USER_ID="${{ inputs.user_id }}"
          APP_ID="${{ inputs.app_id }}"

          TAG_NAME="apk-${USER_ID}-${APP_ID}"

          echo "=========================================="
          echo "CHECKING OLD APK RELEASE"
          echo "=========================================="

          echo "User ID: $USER_ID"
          echo "App ID: $APP_ID"
          echo "Tag: $TAG_NAME"

          if gh release view "$TAG_NAME" \
            --repo timetotime798546/apk-storage >/dev/null 2>&1; then

            echo ""
            echo "Old release found."
            echo "Deleting old release and tag..."

            gh release delete "$TAG_NAME" \
              --repo timetotime798546/apk-storage \
              --yes \
              --cleanup-tag

            echo "Old APK release deleted."

          else

            echo ""
            echo "No old APK release found."
            echo "Continuing with new upload."

          fi


      # ==========================================
      # UPLOAD TO APK STORAGE
      # ==========================================

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: timetotime798546/apk-storage
          token: ${{ secrets.APK_STORAGE_TOKEN }}
          tag_name: apk-${{ inputs.user_id }}-${{ inputs.app_id }}
          name: "${{ inputs.app_name }} (${{ inputs.app_id }})"
          files: ${{ steps.apk.outputs.apk_path }}


      # ==========================================
      # REMOVE BUILD FILES
      # ==========================================

      - name: Remove Build Files
        if: always()
        shell: bash
        run: |
          rm -f gradle-8.5-bin.zip
          rm -rf gradle-8.5


      # ==========================================
      # DELETE USER PROJECT
      # ==========================================

      - name: Delete User Project From Repo
        if: success()
        shell: bash
        run: |
          set -e

          USER_ID="${{ inputs.user_id }}"

          echo "=========================================="
          echo "DELETING USER PROJECT"
          echo "=========================================="

          echo "Deleting:"
          echo "native-apps/users/$USER_ID"

          rm -rf "native-apps/users/$USER_ID"

          git config user.name "github-actions"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "Delete user project $USER_ID" \
            || echo "No changes to commit"

          git push origin main

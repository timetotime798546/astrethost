<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Neon Rush</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070d;
    touch-action:none;
    user-select:none;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    background:#05070d;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    max-width:520px;
}

#hud{
    position:fixed;
    top:16px;
    left:50%;
    width:calc(100% - 32px);
    max-width:488px;
    transform:translateX(-50%);
    display:flex;
    justify-content:space-between;
    pointer-events:none;
    z-index:5;
}

.box{
    min-width:105px;
    padding:9px 14px;
    border-radius:14px;
    background:rgba(7,12,25,.72);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(8px);
}

.small{
    display:block;
    color:#7e8aa5;
    font-size:9px;
    letter-spacing:2px;
}

.big{
    display:block;
    margin-top:3px;
    color:white;
    font-size:21px;
    font-weight:bold;
}

#controls{
    position:fixed;
    bottom:24px;
    left:50%;
    width:calc(100% - 40px);
    max-width:480px;
    transform:translateX(-50%);
    display:flex;
    justify-content:space-between;
    pointer-events:none;
    z-index:6;
}

.control{
    width:72px;
    height:58px;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:31px;
    background:rgba(10,17,35,.72);
    border:1px solid rgba(255,255,255,.14);
    pointer-events:auto;
}

.control:active{
    transform:scale(.92);
    background:rgba(0,210,255,.28);
}

.screen{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
    background:rgba(3,5,13,.84);
    backdrop-filter:blur(5px);
}

.hidden{
    display:none;
}

.logo{
    font-size:45px;
    font-weight:900;
    letter-spacing:5px;
    color:white;
    text-shadow:
        0 0 10px #00d9ff,
        0 0 30px #00d9ff;
}

.tag{
    margin-top:8px;
    color:#8290ad;
    font-size:11px;
    letter-spacing:3px;
}

.info{
    max-width:300px;
    margin:27px 0;
    color:#adb7ca;
    font-size:14px;
    line-height:1.6;
}

button{
    border:0;
    border-radius:16px;
    padding:16px 42px;
    background:linear-gradient(90deg,#00d9ff,#61ffd4);
    color:#031016;
    font-weight:900;
    letter-spacing:2px;
    font-size:15px;
    box-shadow:0 0 25px rgba(0,220,255,.35);
}

button:active{
    transform:scale(.95);
}

.over{
    color:white;
    font-size:38px;
    font-weight:900;
    text-shadow:
        0 0 12px #ff168c,
        0 0 30px #ff168c;
}

.result{
    color:#cbd3e4;
    font-size:17px;
    margin:20px 0 28px;
}
</style>
</head>

<body>

<div id="game">
    <canvas id="canvas"></canvas>
</div>

<div id="hud">
    <div class="box">
        <span class="small">SCORE</span>
        <span class="big" id="score">0000</span>
    </div>

    <div class="box">
        <span class="small">BEST</span>
        <span class="big" id="best">0000</span>
    </div>
</div>

<div id="controls">
    <div class="control" id="left">‹</div>
    <div class="control" id="right">›</div>
</div>

<div class="screen" id="start">

    <div class="logo">NEON RUSH</div>

    <div class="tag">HIGH SPEED TRAFFIC RUN</div>

    <div class="info">
        Dodge traffic, switch lanes and survive
        as long as possible.
    </div>

    <button id="startButton">
        START RACE
    </button>

</div>

<div class="screen hidden" id="gameOver">

    <div class="over">RACE OVER</div>

    <div class="result" id="result">
        Score: 0
    </div>

    <button id="again">
        RACE AGAIN
    </button>

</div>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d",{
        alpha:false
    });

let W = 0;
let H = 0;
let DPR = 1;

let running = false;

let score = 0;
let best =
    Number(localStorage.getItem("neonRushBest") || 0);

let playerLane = 1;
let playerX = 0;
let targetX = 0;

let roadOffset = 0;
let spawnTimer = 0;

let enemies = [];

let lastTime = 0;

let touchX = 0;


/* ================= RESIZE ================= */

function resize(){

    DPR =
        Math.min(window.devicePixelRatio || 1,2);

    W = Math.min(
        window.innerWidth,
        520
    );

    H = window.innerHeight;

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );

    targetX = laneX(playerLane);

    if(!running)
        playerX = targetX;
}

window.addEventListener("resize",resize);


/* ================= ROAD ================= */

function roadLeft(){

    return W * .105;
}

function roadWidth(){

    return W * .79;
}

function laneWidth(){

    return roadWidth()/3;
}

function laneX(lane){

    return roadLeft() +
        laneWidth()*lane +
        laneWidth()/2;
}


/* ================= SCORE ================= */

function updateScore(){

    document.getElementById("score")
        .textContent =
        String(score).padStart(4,"0");

    document.getElementById("best")
        .textContent =
        String(best).padStart(4,"0");
}


/* ================= DRAW BACKGROUND ================= */

function drawBackground(){

    const g =
        ctx.createLinearGradient(0,0,0,H);

    g.addColorStop(0,"#111c39");
    g.addColorStop(.5,"#070d1d");
    g.addColorStop(1,"#03050b");

    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    /* stars */

    ctx.fillStyle =
        "rgba(255,255,255,.5)";

    for(let i=0;i<35;i++){

        const x =
            (i*83)%W;

        const y =
            (i*137 + roadOffset*.12)%H;

        ctx.fillRect(x,y,1.5,1.5);
    }
}


/* ================= DRAW ROAD ================= */

function drawRoad(){

    const left = roadLeft();
    const width = roadWidth();

    /* road */

    const g =
        ctx.createLinearGradient(
            left,0,
            left+width,0
        );

    g.addColorStop(0,"#111522");
    g.addColorStop(.5,"#202941");
    g.addColorStop(1,"#111522");

    ctx.fillStyle = g;

    ctx.fillRect(
        left,
        0,
        width,
        H
    );

    /* neon borders */

    ctx.fillStyle = "#00d9ff";

    ctx.fillRect(
        left-2,
        0,
        2,
        H
    );

    ctx.fillStyle = "#ff1694";

    ctx.fillRect(
        left+width,
        0,
        2,
        H
    );


    /* lane dashes */

    ctx.fillStyle =
        "rgba(255,255,255,.8)";

    const dashH = 70;
    const gap = 75;

    for(let lane=1;lane<3;lane++){

        const x =
            left + laneWidth()*lane;

        for(
            let y=-dashH+roadOffset%(dashH+gap);
            y<H;
            y+=dashH+gap
        ){

            ctx.fillRect(
                x-2,
                y,
                4,
                dashH
            );
        }
    }


    /* road glow */

    const glow =
        ctx.createLinearGradient(
            left,0,
            left+width,0
        );

    glow.addColorStop(
        0,
        "rgba(0,220,255,.08)"
    );

    glow.addColorStop(
        .5,
        "rgba(255,255,255,0)"
    );

    glow.addColorStop(
        1,
        "rgba(255,20,150,.08)"
    );

    ctx.fillStyle = glow;

    ctx.fillRect(
        left,
        0,
        width,
        H
    );
}


/* ================= CAR ================= */

function drawPlayer(){

    const x = playerX;
    const y = H-145;

    const w = 54;
    const h = 94;

    ctx.save();

    ctx.shadowBlur = 22;
    ctx.shadowColor = "#00d9ff";

    /* body */

    const body =
        ctx.createLinearGradient(
            x-w/2,
            0,
            x+w/2,
            0
        );

    body.addColorStop(0,"#006cff");
    body.addColorStop(.5,"#15eaff");
    body.addColorStop(1,"#006cff");

    ctx.fillStyle = body;

    roundRect(
        x-w/2,
        y,
        w,
        h,
        15
    );

    ctx.fill();


    /* glass */

    ctx.shadowBlur = 0;

    const glass =
        ctx.createLinearGradient(
            0,y+8,
            0,y+37
        );

    glass.addColorStop(0,"#b9f7ff");
    glass.addColorStop(1,"#28547c");

    ctx.fillStyle = glass;

    roundRect(
        x-19,
        y+10,
        38,
        27,
        9
    );

    ctx.fill();


    /* center body */

    ctx.fillStyle =
        "rgba(255,255,255,.22)";

    roundRect(
        x-20,
        y+46,
        40,
        25,
        8
    );

    ctx.fill();


    /* headlights */

    ctx.shadowBlur = 10;
    ctx.shadowColor = "white";

    ctx.fillStyle = "white";

    roundRect(
        x-20,
        y+75,
        9,
        6,
        3
    );

    ctx.fill();

    roundRect(
        x+11,
        y+75,
        9,
        6,
        3
    );

    ctx.fill();

    ctx.restore();
}


/* ================= ENEMY CAR ================= */

function drawEnemy(enemy){

    const x = enemy.x;
    const y = enemy.y;

    const w = 52;
    const h = 90;

    ctx.save();

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ff168c";

    const body =
        ctx.createLinearGradient(
            x-w/2,
            0,
            x+w/2,
            0
        );

    body.addColorStop(0,"#76005f");
    body.addColorStop(.5,"#ff1590");
    body.addColorStop(1,"#76005f");

    ctx.fillStyle = body;

    roundRect(
        x-w/2,
        y,
        w,
        h,
        14
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    /* rear window */

    ctx.fillStyle =
        "#45224f";

    roundRect(
        x-18,
        y+10,
        36,
        26,
        8
    );

    ctx.fill();


    /* body highlight */

    ctx.fillStyle =
        "rgba(255,255,255,.17)";

    roundRect(
        x-19,
        y+45,
        38,
        23,
        7
    );

    ctx.fill();


    /* tail lights */

    ctx.shadowBlur = 9;
    ctx.shadowColor = "#ff168c";

    ctx.fillStyle = "#ffb4e3";

    roundRect(
        x-19,
        y+73,
        9,
        6,
        3
    );

    ctx.fill();

    roundRect(
        x+10,
        y+73,
        9,
        6,
        3
    );

    ctx.fill();

    ctx.restore();
}


/* ================= ROUND RECT ================= */

function roundRect(x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.arcTo(
        x+w,y,
        x+w,y+h,
        r
    );

    ctx.arcTo(
        x+w,y+h,
        x,y+h,
        r
    );

    ctx.arcTo(
        x,y+h,
        x,y,
        r
    );

    ctx.arcTo(
        x,y,
        x+w,y,
        r
    );

    ctx.closePath();
}


/* ================= COLLISION ================= */

function collision(e){

    const playerY = H-145;

    return (
        Math.abs(playerX-e.x)<43 &&
        Math.abs(playerY-e.y)<76
    );
}


/* ================= SPAWN ================= */

function spawnEnemy(){

    const l =
        Math.floor(Math.random()*3);

    enemies.push({
        lane:l,
        x:laneX(l),
        y:-110
    });
}


/* ================= GAME LOOP ================= */

function loop(time){

    if(!running)
        return;

    if(!lastTime)
        lastTime=time;

    let dt =
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime=time;


    /*
       Faster base speed.
       Gets faster as score rises.
    */

    const speed =
        10 + Math.min(score*.10,8);


    roadOffset += speed*dt;


    /* smooth player */

    playerX +=
        (targetX-playerX) *
        Math.min(.28*dt,1);


    /* spawn */

    spawnTimer += dt;

    const spawnRate =
        Math.max(
            25,
            50-score*.45
        );

    if(spawnTimer>spawnRate){

        spawnEnemy();

        spawnTimer=0;
    }


    /* enemies */

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        e.y += speed*dt;

        if(collision(e)){

            endGame();
            return;
        }

        if(e.y>H+120){

            enemies.splice(i,1);

            score++;

            if(score>best){

                best=score;

                localStorage.setItem(
                    "neonRushBest",
                    best
                );
            }

            updateScore();
        }
    }


    /* draw */

    drawBackground();
    drawRoad();

    for(const e of enemies)
        drawEnemy(e);

    drawPlayer();


    animation =
        requestAnimationFrame(loop);
}

let animation;


/* ================= START ================= */

function startGame(){

    enemies=[];
    score=0;

    playerLane=1;

    positionPlayer();

    spawnTimer=0;
    roadOffset=0;

    lastTime=0;

    updateScore();

    document.getElementById("start")
        .classList.add("hidden");

    document.getElementById("gameOver")
        .classList.add("hidden");

    running=true;

    animation =
        requestAnimationFrame(loop);
}


/* ================= END ================= */

function endGame(){

    running=false;

    cancelAnimationFrame(animation);

    document.getElementById("result")
        .textContent =
        "Score: "+
        String(score).padStart(4,"0")+
        "   •   Best: "+
        String(best).padStart(4,"0");

    document.getElementById("gameOver")
        .classList.remove("hidden");
}


/* ================= LANE ================= */

function positionPlayer(){

    targetX =
        laneX(playerLane);

    if(!running)
        playerX=targetX;
}


/* ================= CONTROLS ================= */

function left(){

    if(!running)return;

    if(playerLane>0){

        playerLane--;

        positionPlayer();
    }
}

function right(){

    if(!running)return;

    if(playerLane<2){

        playerLane++;

        positionPlayer();
    }
}


/* buttons */

document.getElementById("left")
    .addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            left();
        }
    );

document.getElementById("right")
    .addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            right();
        }
    );


/* keyboard */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="ArrowLeft")
            left();

        if(e.key==="ArrowRight")
            right();
    }
);


/* swipe */

document.addEventListener(
    "touchstart",
    e=>{

        touchX =
            e.touches[0].clientX;
    },
    {passive:true}
);

document.addEventListener(
    "touchend",
    e=>{

        const x =
            e.changedTouches[0].clientX;

        const diff =
            x-touchX;

        if(Math.abs(diff)>35){

            if(diff<0)
                left();
            else
                right();
        }
    },
    {passive:true}
);


/* start/restart */

document.getElementById("startButton")
    .addEventListener(
        "click",
        startGame
    );

document.getElementById("again")
    .addEventListener(
        "click",
        startGame
    );


/* init */

resize();
updateScore();

</script>

</body>
</html>


buildscript {

    repositories {
        google()

        // Google-hosted Maven Central mirror
        maven {
            url 'https://maven-central.storage-download.googleapis.com/maven2/'
        }

        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
    }
}

allprojects {

    repositories {
        google()

        // Google-hosted Maven Central mirror
        maven {
            url 'https://maven-central.storage-download.googleapis.com/maven2/'
        }

        mavenCentral()
    }
}
